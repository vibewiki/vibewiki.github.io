# Вики-курс по вайбкодингу. Выкладывается на GitHub Pages из репозитория vibewiki/vibewiki.github.io — с корня домена
# (до 2026-10-23 — vibewiki/vibecourse, по адресу с путём /vibecourse; старые адреса переводит репозиторий vibewiki/vibecourse).
site:
  id: vibecoding-wiki
  base_url: "https://vibewiki.github.io"
  title: "Вайбкодинг с нуля"
  description: "Открытый курс для тех, кто не программист: от оплаты и установки до своего сайта, приложения и бота."
  default_og_image: "/media/og.png"         # рисует scripts/brand.py
  media_base_url: "https://vibewiki.github.io/media"
  host: 127.0.0.1

runtime:
  mode: "prod"
  dev:
    base_url: "http://127.0.0.1:8087"
    media_base_url: "http://127.0.0.1:8087/media"

content:
  source: "local"
  local_dir: "./content"

markdown:
  html_policy: "safe"   # материалы приходят от разных авторов: разметка в тексте не исполняется

og_type_by_type:
  home: "website"
  page: "website"
  article: "article"

paths:
  file_root: ./.notepub
  artifacts_dir: ./.notepub/artifacts
  snapshot_file: ./.notepub/snapshot/objects.json
  cache_root: ./.notepub/cache

theme:
  dir: .
  name: "theme"
  templates_subdir: templates
  assets_subdir: assets

server:
  listen: "127.0.0.1:8087"

rules_path: ./rules.yaml

# Слова шаблона. Без repo_url ссылка «Предложить правку» не выводится.
settings:
  site_name: "Вайбкодинг с нуля"
  site_note: "Открытый курс для тех, кто не программист"
  repo_url: "https://github.com/vibewiki/vibewiki.github.io"
  add_slug: "kak-dobavit-material"      # страница, куда ведёт «Добавить материал» в шапке
  after_slug: "posle-kursa"             # оффер в конце курса: «После курса» в шапке, в меню и на главной
  author_label: "Об авторе"
  author_url: "https://antonlozhkin.ru/"
  contact_url: "https://t.me/cookiespooky"
  # Счётчики и подтверждение в вебмастерах — пустые строки ничего не выводят (layout.html).
  metrika_id: "113755107"         # номер счётчика Яндекс.Метрики
  ga_id: ""                       # идентификатор потока Google Analytics, вида G-XXXXXXXXXX
  yandex_verification: ""         # content из метатега подтверждения в Яндекс.Вебмастере
  google_verification: ""         # content из метатега подтверждения в Google Search Console

robots:
  disallow: []

cache:
  html_ttl_seconds: 600
  stale_if_error_seconds: 604800
